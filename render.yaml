# Render Blueprint: the backend's infrastructure, in one Render project. The Blueprint syncs from main; each environment's
# services deploy their own branch.
#
# For now only staging exists, on free instances: one free web service and the workspace's one free Key Value. The main
# environment is added when Terhal launches, and the worker (a background worker, which has no free plan) with the first
# real job. Until then nothing enqueues jobs, so there's nothing for a worker to do.
#
# Secrets (sync: false) are asked for once, when the Blueprint is first created, and never overwritten after that. Each
# environment needs its own values:
#   DATABASE_URL           the Neon branch's pooled URL
#   DATABASE_URL_UNPOOLED  the Neon branch's direct URL, only for migrations
#   ADMIN_SECRET           openssl rand -base64 32. Changing it signs every admin out.
#   TOTP_ENCRYPTION_KEY    openssl rand -base64 32. Changing it breaks every admin's authenticator setup.
#   RESEND_KEY             the Resend API key

projects:
  - name: terhal
    environments:
      - name: staging
        networking:
          isolation: enabled
        services:
          - type: web
            name: server-staging
            runtime: node
            region: frankfurt
            # Sleeps after 15 minutes without traffic and takes about a minute to wake. No shell: seed from a machine
            # against the Neon branch instead.
            plan: free
            branch: staging
            # NODE_ENV=production is set at build time too, which would skip devDependencies; the build needs TypeScript
            # and the start command needs the Prisma CLI.
            buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm turbo run build --filter=@terhal/backend
            # Migrations run before the server starts rather than as a pre-deploy command, which needs a paid instance.
            # There's one instance, so nothing races them.
            startCommand: pnpm --filter @terhal/backend db:deploy && pnpm --filter @terhal/backend start
            healthCheckPath: /health
            # Deploys only once CI has passed on the commit.
            autoDeployTrigger: checksPass
            # Anything that can change the backend build. Web changes don't redeploy it.
            buildFilter:
              paths:
                - backend/**
                - package.json
                - pnpm-lock.yaml
                - pnpm-workspace.yaml
                - turbo.json
                - .nvmrc
            domains:
              - api.staging.terhal.co
            envVars:
              - key: NODE_ENV
                value: production
              - key: DATABASE_URL
                sync: false
              - key: DATABASE_URL_UNPOOLED
                sync: false
              # One Key Value serves both until there's a cache worth its own instance. The rate limiter's keys all expire
              # on their own, so they're safe under noeviction.
              - key: QUEUE_URL
                fromService:
                  type: keyvalue
                  name: queue-staging
                  property: connectionString
              - key: CACHE_URL
                fromService:
                  type: keyvalue
                  name: queue-staging
                  property: connectionString
              - key: SITE_URL
                value: https://staging.terhal.co
              - key: DASHBOARD_URL
                value: https://dashboard.staging.terhal.co
              - key: ADMIN_URL
                value: https://admin.staging.terhal.co
              - key: RESEND_EMAIL
                value: Terhal Staging <no-reply@terhal.co>
              - key: ADMIN_SECRET
                sync: false
              - key: TOTP_ENCRYPTION_KEY
                sync: false
              - key: RESEND_KEY
                sync: false

          # BullMQ needs keys to never be evicted. Free instances keep nothing across a restart, which only costs rate
          # limit counters while no jobs exist. Moves to a paid, persisted plan with the first real job.
          - type: keyvalue
            name: queue-staging
            region: frankfurt
            plan: free
            maxmemoryPolicy: noeviction
            # Private network only.
            ipAllowList: []

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Frontend
      NODE_ENV: development

      # Backend
      NEXT_PUBLIC_API_URL: http://localhost:8080
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      backend:
        condition: service_started
    networks:
      - terhal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Backend
      NODE_ENV: development
      PORT: 8080
      
      # Database
      DATABASE_URL: postgresql://admin:admin@postgres:5432/terhal

      # Localstack (Main)
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test

      # Localstack (S3 Bucket)
      S3_ENDPOINT: http://localstack:4566
      S3_BUCKET: terhal

    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    networks:
      - terhal

  postgres:
    image: postgres:17-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: terhal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U admin -d terhal
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - terhal

  localstack:
    image: localstack/localstack:latest
    container_name: localstack
    restart: unless-stopped
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
      DEBUG: "0"
    volumes:
      - localstack_data:/var/lib/localstack
      - ./docker/localstack/init.sh:/etc/localstack/init/ready.d/init.sh
    healthcheck:
      test:
        - CMD
        - awslocal
        - s3
        - ls
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - terhal

volumes:
  postgres_data:
  localstack_data:

networks:
  terhal:
    driver: bridge

name: Deploy DB Migrations

# Applies pending Prisma migrations to the production database.
# Runs automatically on push to `main` when migrations change, and can also
# be run by hand from the Actions tab ("Run workflow").
# Requires the DIRECT_DATABASE_URL secret (Neon direct, non-pooled string).

on:
  push:
    branches: [main]
    paths:
      - "backend/prisma/migrations/**"
      - "backend/prisma/schema/**"
  workflow_dispatch:

# Never run two migrations against production at the same time.
concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npx prisma migrate deploy
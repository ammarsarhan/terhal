name: CI

# Runs on every push and PR. Branch protection on `main` (set up manually
# in GitHub settings) requires this to pass before a PR can be merged,
# which is what actually gates production deploys on Vercel — Vercel only
# builds Production from `main`, so nothing unreviewed/broken gets there.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm test

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Dummy value: prisma.config.ts reads DATABASE_URL to build the
      # datasource config even for `generate`/`validate`, which don't need
      # a real, reachable database — just a defined connection string.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npm run build
      - run: npm test
